<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lactea — MilkDrop in your browser</title>
<meta name="description" content="Lactea: a pure-Rust MilkDrop 2/3 and projectM-compatible music visualizer, running on WebGPU.">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 8px 12px; background: rgba(0,0,0,.55); border-radius: 8px; transition: opacity .3s; }
  body.idle #ui, body.idle #title { opacity: 0; }
  #title { position: fixed; left: 12px; top: 12px; padding: 6px 10px; background: rgba(0,0,0,.55); border-radius: 8px; transition: opacity .3s; }
  #title a { color: #9cf; }
  #name { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, label.btn { background: #222; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover, label.btn:hover { background: #333; }
  input[type=file] { display: none; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  #msg.show { display: grid; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; font-size: 24px; background: rgba(0,40,80,.6); pointer-events: none; }
  body.dragging #drop { display: grid; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title"><b>Lactea</b> · MilkDrop 2/3 &amp; projectM in Rust + WebGPU · <a href="https://github.com/M0Rf30/lactea">GitHub</a></div>
<div id="msg"></div>
<div id="drop">Drop .milk / .milk2 presets, textures or an audio file</div>
<div id="ui">
  <button id="prev" title="Previous preset (P)">◀</button>
  <button id="next" title="Next preset (N / Space)">▶</button>
  <button id="rand" title="Random preset (R)">🔀</button>
  <span id="name">idle</span>
  <label class="btn" title="Load presets and textures">Presets…<input id="presetFiles" type="file" multiple accept=".milk,.milk2,.png,.jpg,.jpeg,.tga,.bmp"></label>
  <label class="btn" title="Load a folder of presets">Folder…<input id="presetDir" type="file" webkitdirectory></label>
  <label class="btn" title="Play an audio file">Audio file…<input id="audioFile" type="file" accept="audio/*"></label>
  <button id="mic" title="Visualize the microphone / system input">🎤 Mic</button>
  <label title="Change preset every 20 s"><input id="auto" type="checkbox" checked> auto</label>
  <button id="fs" title="Fullscreen (F)">⛶</button>
  <span><kbd>H</kbd> hides UI</span>
</div>
<audio id="player" loop crossorigin="anonymous"></audio>
<script type="module" src="main.js"></script>
</body>
</html>
