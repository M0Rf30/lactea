[package]
name = "lactea-compare"
description = "Fidelity tooling: dump reader/writer, image and variable diffs, reports, `fdcompare` CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Fidelity tooling for this repository (compares against projectM reference dumps); not published.
publish = false

[lib]
name = "lactea_compare"
path = "src/lib.rs"

[[bin]]
name = "fdcompare"
path = "src/main.rs"

[dependencies]
lactea-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
image.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile = "3"
