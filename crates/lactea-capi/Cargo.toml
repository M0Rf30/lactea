[package]
name = "lactea-capi"
description = "C ABI for the lactea MilkDrop engine: self-contained wgpu device, RGBA8 read-back. Header: include/lactea.h."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "lactea_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lactea = { workspace = true }
lactea-jpeg = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
image = { workspace = true, features = ["jpeg", "tga", "bmp"] }

# Vulkan interop (`lactea_create_vulkan`): raw handles of the host's instance/device go through
# `wgpu::hal::vulkan`, whose API is ash types. Same ash version as wgpu-hal.
[target.'cfg(any(windows, all(unix, not(target_vendor = "apple"))))'.dependencies]
ash = { version = "0.38", default-features = false }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
