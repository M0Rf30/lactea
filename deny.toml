# cargo-deny policy: `cargo deny check` (CI job `deny`).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Transitive through winit (sctk-adwaita -> ab_glyph) in the unpublished app; no upgrade exists.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# lactea-app (not published) uses a Symphonia fork until its changes are released.
allow-git = ["https://github.com/M0Rf30/Symphonia"]
