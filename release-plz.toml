# release-plz: version bumps, changelog and crates.io publish for the eight publishable crates.
# All crates share one version (workspace lockstep). release-plz pushes the tag `vX.Y.Z`;
# .github/workflows/release.yml then builds the binaries and creates the GitHub release.

[workspace]
changelog_path = "./CHANGELOG.md"
changelog_config = "cliff.toml"
# The crates share one CHANGELOG.md: only `lactea` writes it (with every crate's commits), otherwise
# each lockstep crate appends its own copy of the release entry.
changelog_update = false
git_release_enable = false
git_tag_enable = false
publish_allow_dirty = false
semver_check = false

[[package]]
name = "lactea"
git_tag_enable = true
git_tag_name = "v{{ version }}"
version_group = "lactea"
changelog_update = true
changelog_include = [
    "lactea-abi",
    "lactea-eel",
    "lactea-preset",
    "lactea-jpeg",
    "lactea-audio",
    "lactea-hlsl",
    "lactea-render",
    "lactea-host",
    "lactea-capi",
    "lactea-app",
    "lactea-cli",
]

[[package]]
name = "lactea-abi"
version_group = "lactea"

[[package]]
name = "lactea-eel"
version_group = "lactea"

[[package]]
name = "lactea-preset"
version_group = "lactea"

[[package]]
name = "lactea-jpeg"
version_group = "lactea"

[[package]]
name = "lactea-audio"
version_group = "lactea"

[[package]]
name = "lactea-hlsl"
version_group = "lactea"

[[package]]
name = "lactea-render"
version_group = "lactea"

[[package]]
name = "lactea-compare"
release = false
publish = false

[[package]]
name = "lactea-app"
release = false
publish = false

[[package]]
name = "lactea-capi"
release = false
publish = false

[[package]]
name = "lactea-cli"
release = false
publish = false

[[package]]
name = "lactea-eel-oracle"
release = false
publish = false

[[package]]
name = "lactea-testutil"
release = false
publish = false
