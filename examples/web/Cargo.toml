[package]
name = "lactea-web-demo"
description = "wasm-bindgen demo: the lactea engine on a <canvas> through WebGPU."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the repository workspace: native `cargo build --workspace` must not need the
# wasm toolchain, and this crate has its own lock file (see build.sh).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
lactea = { path = "../../crates/lactea" }
wgpu = { version = "30", features = ["webgpu"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[profile.release]
opt-level = 3
