version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/web
    schedule:
      interval: weekly
    groups:
      cargo-web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # `@1.88` pins the MSRV job to rust-version, not an action release.
      - dependency-name: dtolnay/rust-toolchain
