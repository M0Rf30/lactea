[package]
name = "lactea-cli"
description = "Headless tools: fdrender (deterministic dumps, teacher forcing) for fidelity work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "fdrender"
path = "src/main.rs"

[dependencies]
lactea = { workspace = true, features = ["diagnostics"] }
lactea-abi = { workspace = true }
lactea-compare = { workspace = true }
lactea-jpeg = { workspace = true }
lactea-render = { workspace = true, features = ["diagnostics"] }
wgpu = { workspace = true }
pollster = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg", "bmp", "tga"] }
lactea-preset = { workspace = true }
